[package]
name = "yglverify"
version = "0.1.0"
edition = "2021"
description = "Spec-driven deterministic verifier (M13-1b): frozen spec in, report out"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
regex = "1"


[[bin]]
name = "yglverify"
path = "src/main.rs"
